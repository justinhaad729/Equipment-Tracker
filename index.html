<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Equipment Tracker</title>

<!-- PWA setup -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f2a3f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Equipment">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root{
    --navy:#0f2a3f;
    --navy-light:#1a4a68;
    --teal:#1f8a8c;
    --teal-light:#e6f4f4;
    --paper:#f6f7f5;
    --ink:#1c2b2f;
    --line:#dbe2e0;
    --own:#6b7280;
    --ordered:#c98a2e;
    --arrived:#1f8a5c;
    --none:#c9cfcd;
    --danger:#b3432c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Roboto, -apple-system, sans-serif;
    background:var(--paper);
    color:var(--ink);
  }
  header{
    background:var(--navy);
    color:#fff;
    padding:22px 20px 20px;
    position:sticky;
    top:0;
    z-index:5;
    box-shadow:0 2px 8px rgba(0,0,0,0.15);
  }
  header .bar{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    max-width:1000px;
    margin:0 auto;
    gap:16px;
    flex-wrap:wrap;
  }
  header h1{
    margin:0;
    font-size:1.4rem;
    letter-spacing:0.3px;
    font-weight:600;
  }
  header .sub{
    color:#a9c4cf;
    font-size:0.8rem;
    margin-top:4px;
  }
  .stamp{
    font-size:0.72rem;
    color:#7fb0be;
    letter-spacing:1px;
    text-transform:uppercase;
    border:1px solid #2c5c72;
    padding:4px 10px;
    border-radius:3px;
  }
  main{
    max-width:1000px;
    margin:0 auto;
    padding:22px 16px 80px;
  }
  .toolbar{
    display:flex;
    gap:10px;
    margin-bottom:18px;
    flex-wrap:wrap;
    align-items:center;
  }
  .toolbar input[type=text]{
    flex:1;
    min-width:180px;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:6px;
    font-size:0.92rem;
    background:#fff;
  }
  .btn{
    border:none;
    cursor:pointer;
    border-radius:6px;
    font-size:0.88rem;
    padding:10px 16px;
    font-weight:600;
    transition:transform .05s ease, opacity .15s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--teal); color:#fff;}
  .btn-primary:hover{opacity:0.9;}
  .btn-ghost{background:#fff; color:var(--navy); border:1px solid var(--line);}
  .btn-ghost:hover{background:var(--teal-light);}
  .btn-danger{background:#fff; color:var(--danger); border:1px solid #e4c2b8;}
  .btn-danger:hover{background:#fbeee9;}

  #addForm{
    background:#fff;
    border:1px solid var(--line);
    border-radius:10px;
    padding:18px;
    margin-bottom:22px;
    display:none;
  }
  #addForm.open{display:block;}
  #addForm h2{
    margin:0 0 14px;
    font-size:1rem;
    color:var(--navy);
  }
  .form-row{
    display:flex;
    gap:12px;
    margin-bottom:12px;
    flex-wrap:wrap;
  }
  .form-row label{
    flex:1;
    min-width:180px;
    font-size:0.78rem;
    font-weight:600;
    color:#5a6b6e;
    text-transform:uppercase;
    letter-spacing:0.4px;
  }
  .form-row input{
    display:block;
    width:100%;
    margin-top:6px;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:6px;
    font-size:0.95rem;
  }
  .form-actions{
    display:flex;
    gap:10px;
    justify-content:flex-end;
    margin-top:6px;
  }

  .empty{
    text-align:center;
    color:#8a9694;
    padding:60px 20px;
    border:1.5px dashed var(--line);
    border-radius:10px;
    font-size:0.95rem;
  }

  .patient-card{
    background:#fff;
    border:1px solid var(--line);
    border-left:4px solid var(--teal);
    border-radius:8px;
    margin-bottom:14px;
    overflow:hidden;
  }
  .patient-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 16px;
    cursor:pointer;
    gap:10px;
  }
  .patient-head:hover{background:#fafcfc;}
  .patient-id h3{
    margin:0;
    font-size:1.02rem;
    color:var(--navy);
  }
  .patient-id .mrn{
    font-size:0.78rem;
    color:#7d8a88;
    margin-top:2px;
  }
  .head-right{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .progress-chip{
    font-size:0.72rem;
    padding:4px 9px;
    border-radius:20px;
    background:var(--teal-light);
    color:var(--teal);
    font-weight:600;
    white-space:nowrap;
  }
  .chevron{
    transition:transform .2s ease;
    color:#8a9694;
    font-size:0.85rem;
  }
  .patient-card.expanded .chevron{transform:rotate(90deg);}
  .patient-body{
    max-height:0;
    overflow:hidden;
    transition:max-height .25s ease;
    border-top:1px solid transparent;
  }
  .patient-card.expanded .patient-body{
    border-top:1px solid var(--line);
  }
  .patient-body-inner{
    padding:16px;
  }
  .equip-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(230px,1fr));
    gap:10px;
    margin-bottom:16px;
  }
  .equip-item{
    border:1px solid var(--line);
    border-radius:7px;
    padding:10px 12px;
  }
  .equip-item .equip-name{
    font-size:0.88rem;
    font-weight:600;
    color:var(--ink);
    margin-bottom:8px;
  }
  .status-group{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
  }
  .status-btn{
    flex:1;
    min-width:64px;
    border:1px solid var(--line);
    background:#fff;
    padding:6px 4px;
    border-radius:5px;
    font-size:0.72rem;
    font-weight:600;
    cursor:pointer;
    color:#6b7776;
    text-align:center;
  }
  .status-btn[data-status="none"].active{background:var(--none); color:#fff; border-color:var(--none);}
  .status-btn[data-status="own"].active{background:var(--own); color:#fff; border-color:var(--own);}
  .status-btn[data-status="ordered"].active{background:var(--ordered); color:#fff; border-color:var(--ordered);}
  .status-btn[data-status="arrived"].active{background:var(--arrived); color:#fff; border-color:var(--arrived);}

  .comment-block label{
    font-size:0.78rem;
    font-weight:600;
    color:#5a6b6e;
    text-transform:uppercase;
    letter-spacing:0.4px;
  }
  .comment-block textarea{
    width:100%;
    margin-top:6px;
    padding:10px;
    border:1px solid var(--line);
    border-radius:6px;
    font-family:inherit;
    font-size:0.9rem;
    min-height:64px;
    resize:vertical;
  }
  .card-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:14px;
  }
  .saved-tag{
    font-size:0.72rem;
    color:#9aa6a4;
  }

  footer{
    text-align:center;
    font-size:0.72rem;
    color:#9aa6a4;
    padding:20px;
  }

  @media (max-width:520px){
    header .bar{flex-direction:column; align-items:flex-start;}
    .patient-head{flex-wrap:wrap;}
  }
</style>
</head>
<body>

<header>
  <div class="bar">
    <div>
      <h1>Equipment Tracker</h1>
      <div class="sub">Rehab equipment status by patient</div>
    </div>
    <div class="stamp" id="dateStamp"></div>
  </div>
</header>

<div id="installBanner" style="display:none; background:#e6f4f4; border-bottom:1px solid #c9e4e4; padding:10px 16px; text-align:center; font-size:0.85rem; color:#0f2a3f;">
  Install this app on your device for offline, one-tap access.
  <button id="installBtn" class="btn btn-primary" style="padding:6px 14px; font-size:0.8rem; margin-left:8px;">Install</button>
</div>

<main>
  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="Search by name or MRN…">
    <button class="btn btn-primary" id="toggleFormBtn">+ Add Patient</button>
  </div>

  <div id="addForm">
    <h2>New Patient</h2>
    <div class="form-row">
      <label>Patient Name
        <input type="text" id="newName" placeholder="e.g. Ahmed Al Mansoori">
      </label>
      <label>MRN
        <input type="text" id="newMRN" placeholder="e.g. 100234">
      </label>
    </div>
    <div class="form-actions">
      <button class="btn btn-ghost" id="cancelAddBtn">Cancel</button>
      <button class="btn btn-primary" id="saveAddBtn">Add Patient</button>
    </div>
  </div>

  <div id="patientList"></div>
  <div class="empty" id="emptyState" style="display:none;">
    No patients yet. Click <strong>+ Add Patient</strong> to start tracking equipment.
  </div>
</main>

<footer>Equipment Tracker — data is saved only in this browser, on this device.</footer>

<script>
const EQUIPMENT = ["Wheelchair","Hoist","Sling","Commode w/c","Bed Mattress","Splints","Assistive Device"];
const STATUSES = [
  {key:"none", label:"—"},
  {key:"own", label:"Own"},
  {key:"ordered", label:"Ordered"},
  {key:"arrived", label:"Arrived"}
];
const STORE_KEY = "equipmentTrackerData_v1";

let patients = loadData();
let expandedId = null;

function loadData(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){
    console.error("Failed to load data", e);
    return [];
  }
}

function saveData(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(patients));
  }catch(e){
    console.error("Failed to save data", e);
    alert("Could not save data. Your browser storage may be full or disabled.");
  }
}

function blankEquipmentState(){
  const obj = {};
  EQUIPMENT.forEach(name => obj[name] = "none");
  return obj;
}

function uid(){
  return 'p_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

function dateStamp(){
  const el = document.getElementById('dateStamp');
  const now = new Date();
  el.textContent = now.toLocaleDateString(undefined, {weekday:'short', year:'numeric', month:'short', day:'numeric'});
}

function progressSummary(p){
  const vals = Object.values(p.equipment);
  const total = vals.filter(v => v !== "none").length;
  const arrived = vals.filter(v => v === "arrived").length;
  if(total === 0) return "No equipment set";
  return `${arrived}/${total} arrived`;
}

function render(){
  const list = document.getElementById('patientList');
  const empty = document.getElementById('emptyState');
  const query = document.getElementById('searchInput').value.trim().toLowerCase();

  const filtered = patients.filter(p =>
    p.name.toLowerCase().includes(query) || p.mrn.toLowerCase().includes(query)
  );

  list.innerHTML = "";

  if(patients.length === 0){
    empty.style.display = "block";
    empty.textContent = "No patients yet. Click + Add Patient to start tracking equipment.";
  } else if(filtered.length === 0){
    empty.style.display = "block";
    empty.textContent = "No matches found.";
  } else {
    empty.style.display = "none";
  }

  filtered.forEach(p => {
    const card = document.createElement('div');
    card.className = 'patient-card' + (expandedId === p.id ? ' expanded' : '');
    card.dataset.id = p.id;

    const head = document.createElement('div');
    head.className = 'patient-head';
    head.innerHTML = `
      <div class="patient-id">
        <h3>${escapeHtml(p.name)}</h3>
        <div class="mrn">MRN: ${escapeHtml(p.mrn)}</div>
      </div>
      <div class="head-right">
        <span class="progress-chip">${progressSummary(p)}</span>
        <span class="chevron">&#9656;</span>
      </div>
    `;
    head.addEventListener('click', () => {
      expandedId = (expandedId === p.id) ? null : p.id;
      render();
    });

    const body = document.createElement('div');
    body.className = 'patient-body';

    const inner = document.createElement('div');
    inner.className = 'patient-body-inner';

    const grid = document.createElement('div');
    grid.className = 'equip-grid';
    EQUIPMENT.forEach(eq => {
      const item = document.createElement('div');
      item.className = 'equip-item';
      const currentStatus = p.equipment[eq] || 'none';
      item.innerHTML = `
        <div class="equip-name">${eq}</div>
        <div class="status-group">
          ${STATUSES.map(s => `
            <button type="button" class="status-btn ${s.key === currentStatus ? 'active' : ''}"
              data-status="${s.key}" data-equip="${eq}">${s.label}</button>
          `).join('')}
        </div>
      `;
      grid.appendChild(item);
    });
    grid.addEventListener('click', (e) => {
      const btn = e.target.closest('.status-btn');
      if(!btn) return;
      const eq = btn.dataset.equip;
      const status = btn.dataset.status;
      p.equipment[eq] = status;
      saveData();
      render();
      // keep this card expanded and scroll position stable
      expandedId = p.id;
    });

    const commentBlock = document.createElement('div');
    commentBlock.className = 'comment-block';
    commentBlock.innerHTML = `
      <label>Comments</label>
      <textarea placeholder="Notes about this patient's equipment…">${escapeHtml(p.comment || '')}</textarea>
    `;
    const textarea = commentBlock.querySelector('textarea');
    textarea.addEventListener('input', () => {
      p.comment = textarea.value;
      saveData();
    });

    const footerRow = document.createElement('div');
    footerRow.className = 'card-footer';
    footerRow.innerHTML = `<span class="saved-tag">Autosaved to this browser</span>`;
    const delBtn = document.createElement('button');
    delBtn.className = 'btn btn-danger';
    delBtn.textContent = 'Delete Patient';
    delBtn.addEventListener('click', () => {
      if(confirm(`Remove ${p.name} from the tracker? This cannot be undone.`)){
        patients = patients.filter(x => x.id !== p.id);
        if(expandedId === p.id) expandedId = null;
        saveData();
        render();
      }
    });
    footerRow.appendChild(delBtn);

    inner.appendChild(grid);
    inner.appendChild(commentBlock);
    inner.appendChild(footerRow);
    body.appendChild(inner);

    card.appendChild(head);
    card.appendChild(body);
    list.appendChild(card);

    if(expandedId === p.id){
      body.style.maxHeight = body.scrollHeight + 'px';
    }
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// Add patient form logic
const addForm = document.getElementById('addForm');
const toggleFormBtn = document.getElementById('toggleFormBtn');
const cancelAddBtn = document.getElementById('cancelAddBtn');
const saveAddBtn = document.getElementById('saveAddBtn');
const newName = document.getElementById('newName');
const newMRN = document.getElementById('newMRN');

toggleFormBtn.addEventListener('click', () => {
  addForm.classList.toggle('open');
  if(addForm.classList.contains('open')) newName.focus();
});
cancelAddBtn.addEventListener('click', () => {
  addForm.classList.remove('open');
  newName.value = '';
  newMRN.value = '';
});
saveAddBtn.addEventListener('click', () => {
  const name = newName.value.trim();
  const mrn = newMRN.value.trim();
  if(!name || !mrn){
    alert("Please enter both patient name and MRN.");
    return;
  }
  const p = {
    id: uid(),
    name: name,
    mrn: mrn,
    equipment: blankEquipmentState(),
    comment: "",
    createdAt: new Date().toISOString()
  };
  patients.unshift(p);
  expandedId = p.id;
  saveData();
  newName.value = '';
  newMRN.value = '';
  addForm.classList.remove('open');
  render();
});
newMRN.addEventListener('keydown', (e) => {
  if(e.key === 'Enter') saveAddBtn.click();
});

document.getElementById('searchInput').addEventListener('input', render);

dateStamp();
render();

// PWA: register service worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => {
      console.error('Service worker registration failed:', err);
    });
  });
}

// PWA: custom install prompt (Android/desktop Chrome)
let deferredPrompt = null;
const installBanner = document.getElementById('installBanner');
const installBtn = document.getElementById('installBtn');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBanner.style.display = 'block';
});

installBtn?.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  installBanner.style.display = 'none';
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
});

window.addEventListener('appinstalled', () => {
  installBanner.style.display = 'none';
  deferredPrompt = null;
});
</script>
</body>
</html>
